<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sentinel X | Login</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <link
        rel="stylesheet"
        href="css/login.css"
    >

</head>


<body class="login-page">


    <main class="login-wrapper">


        <!-- ========================= -->
        <!-- Sentinel X Brand -->
        <!-- ========================= -->

        <section class="login-brand">

            <div class="login-brand-content">


                <div class="login-logo">
                    🛡️
                </div>


                <h1>
                    Sentinel X
                </h1>


                <h2>
                    Security Operations Center
                </h2>


                <p>
                    Cyber Incident Response Platform
                </p>


            </div>

        </section>



        <!-- ========================= -->
        <!-- Login -->
        <!-- ========================= -->

        <section class="login-panel">


            <div class="login-card">


                <div class="login-card-header">


                    <div class="login-card-icon">
                        🔐
                    </div>


                    <h2>
                        Secure Login
                    </h2>


                    <p>
                        Sign in to access Sentinel X
                    </p>


                </div>



                <form
                    id="sentinelLoginForm"
                    autocomplete="off"
                >


                    <!-- Username -->

                    <div class="login-form-group">


                        <label for="loginUsername">
                            Username
                        </label>


                        <div class="login-input-wrapper">


                            <span class="login-input-icon">
                                👤
                            </span>


                            <input
                                type="text"
                                id="loginUsername"
                                name="username"
                                placeholder="Enter username"
                                autocomplete="username"
                                required
                            >


                        </div>


                    </div>



                    <!-- Password -->

                    <div class="login-form-group">


                        <label for="loginPassword">
                            Password
                        </label>


                        <div class="login-input-wrapper">


                            <span class="login-input-icon">
                                🔑
                            </span>


                            <input
                                type="password"
                                id="loginPassword"
                                name="password"
                                placeholder="Enter password"
                                autocomplete="current-password"
                                required
                            >


                            <button
                                type="button"
                                id="toggleLoginPassword"
                                class="password-toggle"
                                aria-label="Show password"
                                title="Show password"
                            >
                                👁️
                            </button>


                        </div>


                    </div>



                    <!-- Login Message -->

                    <div
                        id="loginMessage"
                        class="login-message"
                        role="alert"
                        aria-live="polite"
                    ></div>



                    <!-- Login Button -->

                    <button
                        type="submit"
                        id="loginButton"
                        class="login-button"
                    >

                        <span>
                            🔐
                        </span>

                        <span>
                            Access SOC Center
                        </span>

                    </button>


                </form>


            </div>


        </section>


    </main>


    <script src="script.js"></script>


</body>

</html>
